{% extends "base.html" %}

{% block title %}Delete Project{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm border-danger">
      <div class="card-body p-4">
        <h4 class="card-title text-danger">Delete "{{ object.name }}"?</h4>
        <p class="text-muted">This will permanently delete the project and all its tasks. This cannot be undone.</p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Yes, delete</button>
            <a href="{% url 'project_detail' object.pk %}" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
