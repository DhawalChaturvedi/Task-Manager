{% load crispy_forms_tags %}
<div class="border rounded p-3 mb-3 bg-light">
  <form method="post"
        action="{% if task %}{% url 'task_edit' task.pk %}{% else %}{% url 'task_create' project.pk %}{% endif %}"
        hx-post="{% if task %}{% url 'task_edit' task.pk %}{% else %}{% url 'task_create' project.pk %}{% endif %}"
        hx-target="#task-list"
        hx-swap="innerHTML">
    {% csrf_token %}
    {{ form|crispy }}
    <div class="d-flex gap-2 mt-2">
      <button type="submit" class="btn btn-primary btn-sm">Save</button>
      <button type="button" class="btn btn-secondary btn-sm"
              hx-get="" hx-target="#task-form-container" hx-swap="innerHTML">
        Cancel
      </button>
    </div>
  </form>
</div>
