{% if tasks %}
<table class="table table-hover align-middle">
  <thead class="table-light">
    <tr>
      <th>Title</th>
      <th>Priority</th>
      <th>Assigned</th>
      <th>Due</th>
      <th>Status</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {% for task in tasks %}
      {% include "tasks/task_row_partial.html" with task=task project=project is_admin=is_admin %}
    {% endfor %}
  </tbody>
</table>
{% else %}
<p class="text-muted small">No tasks yet.</p>
{% endif %}
